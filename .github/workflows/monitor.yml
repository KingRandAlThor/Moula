name: monitor-cotes
on:
  schedule:
    - cron: "20 3 * * *"
    - cron: "5 6 * * *"
    - cron: "35 7 * * *"
    - cron: "20 9 * * *"
    - cron: "5 10 * * *"
    - cron: "50 10 * * *"
    - cron: "35 11 * * *"
    - cron: "20 12 * * *"
    - cron: "10 13 * * *"
    - cron: "40 14 * * *"
    - cron: "30 16 * * *"
    - cron: "30 18 * * *"
    - cron: "30 20 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency: monitor

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install requests scikit-learn numpy
      - name: Restaurer l'historique des cotes
        uses: actions/cache@v4
        with:
          path: |
            odds.db
            model.pkl
          key: odds-${{ github.run_id }}
          restore-keys: odds-
      - name: Cycle de surveillance
        env:
          ACTIVE_FROM: "0"
          ACTIVE_TO: "24"
          RESPECT_HOURS: "1"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTS: ${{ vars.SPORTS }}
          BANKROLL: ${{ vars.BANKROLL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FREE_USER: ${{ secrets.FREE_USER }}
          FREE_PASS: ${{ secrets.FREE_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          AF_KEY: ${{ secrets.AF_KEY }}
        run: python monitor.py once
