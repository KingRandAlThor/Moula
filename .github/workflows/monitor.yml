name: monitor-cotes
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      revive:
        description: "Ressusciter le bot (solde remis à BANKROLL)"
        default: "0"
concurrency: monitor

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install requests scikit-learn numpy
      - name: Restaurer l'historique des cotes
        uses: actions/cache@v4
        with:
          path: |
            odds.db
            model.pkl
          key: odds-${{ github.run_id }}
          restore-keys: odds-
      - name: Cycle de surveillance
        env:
          ACTIVE_FROM: "0"
          ACTIVE_TO: "24"
          RESPECT_HOURS: "1"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTS: ${{ vars.SPORTS }}
          BANKROLL: ${{ vars.BANKROLL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FREE_USER: ${{ secrets.FREE_USER }}
          FREE_PASS: ${{ secrets.FREE_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          AF_KEY: ${{ secrets.AF_KEY }}
          DAEMON_MINUTES: "345"
          CYCLE_MIN: "30"
          REVIVE: ${{ github.event.inputs.revive }}
        run: python monitor.py daemon
